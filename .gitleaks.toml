title = "DevSecOps MEAN — Gitleaks config"

[allowlist]
description = "Global allowlist — exclusions de chemins"
paths = [
  '''pipeline/out/''',
  '''pipeline/runs/''',
  '''pipeline/.venv/''',
  '''app/server/node_modules/''',
  '''docs/''',
  '''app/inject/''',
  '''\.sarif$''',
  '''\.log$''',
  '''pivot-.*\.json$''',
  '''decision.*\.json$''',
  '''gitleaks\.json$''',
]

[[rules]]
id = "aws-access-key"
description = "AWS access key"
regex = '''\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'''
entropy = 3
keywords = ["akia", "asia", "abia", "acca"]

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(api[_-]?key|apikey|secret[_-]?key|token)\s*[:=]\s*['"]([a-zA-Z0-9\-_.]{20,})['"]'''
entropy = 3

[[rules]]
id = "generic-secret"
description = "Generic secret"
regex = '''(?i)(password|passwd|pwd|secret|token)\s*[:=]\s*['"]([^'"]{8,})['"]'''
entropy = 2
