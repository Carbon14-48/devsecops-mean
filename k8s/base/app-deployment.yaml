apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-app
  namespace: devsecops
  labels:
    app: devsecops-app
    app.kubernetes.io/name: devsecops-app
    app.kubernetes.io/part-of: devsecops-mean
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-app
  template:
    metadata:
      labels:
        app: devsecops-app
    spec:
      containers:
        - name: app
          image: mean-app:local
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_URI
              value: "mongodb://admin:admin123@mongodb:27017/devsecops?authSource=admin"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: api-key
            - name: NODE_ENV
              value: production
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devsecops
type: Opaque
stringData:
  api-key: "AKIAIOSFODNN7EXAMPLE"
